      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".55" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
